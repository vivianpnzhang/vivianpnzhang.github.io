<head>

  <meta property="og:site_name" content="Vivian Zhang" />
  <meta property="og:title" content="Photos | Vivian Zhang" />
  <meta property="og:description" content="My 5-9 after my 9-5: flying, travel and life." />
  <meta property="og:url" content="https://vivianpnzhang.ca/photos.html" />
  <meta property="og:image" content="https://vivianpnzhang.ca/preview.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://vivianpnzhang.ca/preview.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
  <script src="photos.js" defer></script>
</head>
<body>
  <div class="wrap wide">

    <header class="nav">
      <a class="nav-logo" href="index.html">vz<span>.</span></a>
      <div class="nav-right">
        <nav class="nav-links">
          <a href="index.html">home</a>
          <a href="projects.html">projects</a>
          <a href="photos.html" class="active">photos</a>
        </nav>
        <button class="theme-btn" id="themeToggle" aria-label="Toggle light/dark theme">☀</button>
      </div>
    </header>

    <main>
      <section class="page-head">
        <p class="kicker">off duty</p>
        <h1>Photos</h1>
        <p class="lede">my 5-9 after my 9-5</p>
      </section>

      <!-- Tabs: each one loads pictures from its own folder in /photos -->
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="flying">flying</button>
        <button class="tab" role="tab" data-tab="travel">travel</button>
        <button class="tab" role="tab" data-tab="life">life</button>
      </div>

      <div class="gallery" id="gallery"></div>
      <p class="gallery-empty" id="empty" hidden>Photos are on the way. Check back soon ✈</p>
    </main>

    <footer class="footer">
      <div class="footer-row">
        <span class="footer-links">
          <a href="https://www.linkedin.com/in/vivian-pn-zhang/" target="_blank" rel="noopener">linkedin ↗</a>
          <a href="mailto:vivianpnzhang@gmail.com">email ↗</a>
          <a href="resume.pdf" target="_blank" rel="noopener">résumé ↗</a>
        </span>
        <span>Toronto, Canada</span>
      </div>
      <div class="runway" aria-hidden="true"></div>
      <p class="copyright">© <span id="year">2026</span> Vivian Zhang</p>
    </footer>

  </div>

  <!-- Opens when you click a photo -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" id="lbClose" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
    <figure>
      <div class="lb-media" id="lbMedia"></div>
      <figcaption id="lbCaption"></figcaption>
    </figure>
    <button class="lb-nav lb-next" id="lbNext" aria-label="Next photo">›</button>
  </div>
</body>
</html>
